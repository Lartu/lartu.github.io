        html {
            box-sizing: border-box;
        }

        *,
        *::before,

        }

        body {
            margin: 0;
            overflow: auto;
            background: black;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 11pt;
        }

        #gameContainer {
            display: none;
            width: 100%;
            overflow-x: auto;
        }

        #unity-canvas {
            display: block;
            width: 800px;
            height: 600px;
            min-width: 800px;

            background: {
                    {
                        {

                    }
                }
            }

            ;

        canvas+* {

        }

        #loader {
            position: relative;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: black;
        }

        .progress {
            margin: 1.5em;
            border: 1px solid rgb(186, 103, 9);
            width: min(400px, calc(100vw - 3em));
            display: none;
        }

        .progress .full {
            margin: 2px;
            height: 2em;
            background: rgb(186, 103, 9);
            transform: scaleX(0);
            transform-origin: top left;
        }

        #loader-message.error {
            color: #ff8a8a;
        }

        .bordered-box-menu {
            max-width: 800px;
            margin: 20px auto 0;
            border: 12px solid transparent;
            border-image-source: url("box_border_2.png");
            border-image-slice: 12 fill;
            border-image-repeat: repeat;
            border-image-outset: 4px;
            color: white;
            font-size: 12px;

        .bordered-box-menu table {

        .footer a {

        }

        .menu-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .menu-link+.menu-link {
            margin-left: 10px;
        }

        .footer {
            padding: 10px 10px 20px;
            text-align: center;
            color: white;
            font-size: 8pt;

        .footer a {

        }

        #unity-canvas,
        #unity-canvas:focus,
        #unity-canvas:focus-visible {
            outline: none;
            border: none;
            -webkit-tap-highlight-color: transparent;
        }

    <script>
        var canvas = document.querySelector("#unity-canvas");
        var gameContainer = document.querySelector("#gameContainer");
        var loader = document.querySelector("#loader");
        var loaderMessage = document.querySelector("#loader-message");
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/lartumud.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/lartumud.data.unityweb",
            frameworkUrl: buildUrl + "/lartumud.framework.js.unityweb",
            codeUrl: buildUrl + "/lartumud.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "/"Lartu"",
            productName: "/"Eterspire"",
            productVersion: "/"0.5""
        };

        function setCookie(name, value, days) {
            var expires = "";
            if (days) {
                var date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
        }

        function getCookie(name) {
            var nameEQ = name + "=";
            var cookies = document.cookie.split(";");
            for (var i = 0; i < cookies.length; i++) {
                var cookie = cookies[i];
                while (cookie.charAt(0) === " ") cookie = cookie.substring(1);
                if (cookie.indexOf(nameEQ) === 0) return cookie.substring(nameEQ.length);
            }
            return 1;
        }

        function resizeScreen(type) {
            var useSmallScreen = Number(type) === 1;
            if (useSmallScreen) {
                canvas.style.width = "800px";
                canvas.style.height = "600px";
                setCookie("eterspire_screen_size", 1, 999);
                return 1;
            }
            canvas.style.width = "calc(100% - 40px)";
            canvas.style.height = Math.max(window.innerHeight - 100, 600) + "px";
            setCookie("eterspire_screen_size", 0, 999);
            return 0;
        }

        resizeScreen(getCookie("eterspire_screen_size"));
        window.addEventListener("resize", function () {
            resizeScreen(getCookie("eterspire_screen_size"));
        });

        function showLoadError(message) {
            document.querySelector("#loader .progress").style.display = "none";
            loaderMessage.classList.add("error");
            loaderMessage.textContent = "Eterspire could not be loaded: " + message;
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function () {
            document.querySelector("#loader .progress").style.display = "block";
            createUnityInstance(canvas, config, function (progress) {
                document.querySelector("#loader .progress .full").style.transform = "scaleX(" + progress + ")";
            }).then(function (unityInstance) {
                loader.style.display = "none";
                gameContainer.style.display = "block";
                window.unityInstance = unityInstance;
            }).catch(function (message) {
                showLoadError(message);
            });
        };
        script.onerror = function () {
            showLoadError("the Unity loader script was not found. Run this page through a local web server.");
        };
        document.body.appendChild(script);

        window.onbeforeunload = function (event) {
            event.preventDefault();
            event.returnValue = "";
        };

        document.onkeydown = function (event) {
            event = event || window.event;
            if (!event.ctrlKey && !event.metaKey) return;
            var code = event.which || event.keyCode;
            if (code === 83 || code === 87) {
                event.preventDefault();
                event.stopPropagation();
            }
        };

        canvas.onselectstart = function () { return false; };
    </script>
</body>

</html>
